<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#6E8EFB"/>
    </linearGradient>

    <!-- Subdued Gradient -->
    <linearGradient id="subduedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="1050" cy="70" r="160" fill="#00F2FE" opacity="0.08" filter="url(#glow)"/>
  <circle cx="150" cy="270" r="140" fill="#6E8EFB" opacity="0.07" filter="url(#glow)"/>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>

  <!-- Technical Monospace Tag / Terminal Badge -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="168" height="26" rx="6" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00F2FE"/>
    <text x="26" y="17" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1.2">SYSTEM // ONLINE</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">REUBG DEV</text>
  </g>

  <!-- Developer Full Name -->
  <g transform="translate(60, 172)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3">Reuben Binu George</text>
  </g>

  <!-- Specialization / Disciplines -->
  <g transform="translate(60, 212)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
      <tspan fill="#38BDF8" font-weight="600">Full Stack Developer</tspan>
      <tspan fill="#475569">  •  </tspan>
      <tspan fill="#E2E8F0">MERN Stack</tspan>
      <tspan fill="#475569">  •  </tspan>
      <tspan fill="#38BDF8" font-weight="600">Game Developer (Unity)</tspan>
      <tspan fill="#475569">  •  </tspan>
      <tspan fill="#E2E8F0">UI/UX Designer</tspan>
    </text>
  </g>

  <!-- Philosophy Tagline -->
  <g transform="translate(60, 266)">
    <text x="0" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="13" font-weight="500" letter-spacing="2.5">BUILD. DESIGN. EXPERIMENT.</text>
  </g>

  <!-- Right Side Decorative Elements: Technical Specs Box -->
  <g transform="translate(850, 60)">
    <!-- Box Frame -->
    <rect x="0" y="0" width="290" height="220" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
    
    <!-- Box Header -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 280 0 C 285.523 0 290 4.477 290 10 L 290 34 L 0 34 Z" fill="#131B2E"/>
    <circle cx="16" cy="17" r="4.5" fill="#EF4444"/>
    <circle cx="30" cy="17" r="4.5" fill="#F59E0B"/>
    <circle cx="44" cy="17" r="4.5" fill="#10B981"/>
    <text x="64" y="21" fill="#64748B" font-family="monospace" font-size="11" font-weight="600">reubg.config.ts</text>
    
    <!-- Code Content -->
    <text x="20" y="62" fill="#38BDF8" font-family="monospace" font-size="12">const <tspan fill="#F8FAFC">developer</tspan> = {</text>
    
    <text x="32" y="86" fill="#94A3B8" font-family="monospace" font-size="12">stack: <tspan fill="#34D399">'MERN'</tspan>,</text>
    <text x="32" y="110" fill="#94A3B8" font-family="monospace" font-size="12">engine: <tspan fill="#34D399">'Unity 3D'</tspan>,</text>
    <text x="32" y="134" fill="#94A3B8" font-family="monospace" font-size="12">realtime: <tspan fill="#34D399">'Socket.IO'</tspan>,</text>
    <text x="32" y="158" fill="#94A3B8" font-family="monospace" font-size="12">status: <tspan fill="#38BDF8">'Available for hire'</tspan>,</text>
    <text x="32" y="182" fill="#94A3B8" font-family="monospace" font-size="12">portfolio: <tspan fill="#818CF8">'reubg.in'</tspan></text>
    
    <text x="20" y="204" fill="#38BDF8" font-family="monospace" font-size="12">};</text>
  </g>
</svg>
